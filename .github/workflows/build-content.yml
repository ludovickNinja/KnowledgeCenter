name: Build content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - ".github/workflows/build-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Build content.js (fails on invalid frontmatter)
        run: python scripts/build_content.py

      - name: Commit content.js if it changed
        run: |
          if git diff --quiet -- content.js; then
            echo "content.js unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js
          git commit -m "Build content.js from content/"
          git pull --rebase origin main
          git push origin HEAD:main
